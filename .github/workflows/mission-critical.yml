name: Mission Critical (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  tactical-verification:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3

    - name: Supply Line Setup (Node.js ${{ matrix.node-version }})
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Ordinance (Dependencies)
      run: npm ci

    - name: Perimeter Check (Lint)
      run: npm run lint

    - name: Live Fire Exercise (Unit Tests)
      run: npm run test:unit
